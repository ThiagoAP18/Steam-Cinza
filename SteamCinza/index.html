<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tela Principal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <header class="site-header">

  <div class="header-left">
    <div class="logo">LOGO</div>
  </div>

  <div class="header-center">
    <label class="search-wrapper" for="search-input">
      <input id="search-input" class="search-input" type="search" placeholder="Busque pelos jogos de interesse" />
      <button class="search-btn" aria-label="Pesquisar">🔍</button>
    </label>
  </div>

  <div class="header-right">

    <button class="icon-btn notif-btn" aria-label="Notificações">🔔</button>

    <span class="notif-badge">0</span>

    <button class="icon-btn" aria-label="Perfil">👤</button>

  </div>

</header>

<div class="notif-panel">
  <h3>Notificações</h3>
  <div class="notif-list"></div>
</div>

  <main class="main container">
    <section class="boxes-section">
      <h2 class="section-title small">Você tem caixas disponíveis</h2>
      <div class="boxes-row">
        <button class="box" data-box="1">
          <span class="box-label">CAIXA 1</span>
        </button>

        <button class="box" data-box="2">
          <span class="box-label">CAIXA 2</span>
        </button>

        <button class="box" data-box="3">
          <span class="box-label">CAIXA 3</span>
        </button>
      </div>
    </section>

    <section class="related-section">
      <h2 class="section-title">Relacionados à produtos de interesse</h2>

      <div class="cards-grid" id="home-cards">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small>Prototipo — substituir logos e imagens</small>
  </footer>
</body>
</html>
