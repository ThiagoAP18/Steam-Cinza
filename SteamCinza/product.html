<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

<header class="header">
    <input id="search" placeholder="Busque pelos jogos de interesse">
    <div class="icons">
        <span>👤</span>
        <span>🔔</span>
    </div>
</header>

<main class="product-container container">

    <div class="left-column">
        <div class="preview">VÍDEO</div>
        <div class="thumbs" id="thumbs">
        </div>

        <div class="actions">
            <button class="pill buy">COMPRAR</button>
            <button class="pill rent">ALUGAR</button>
            <button class="pill trade">TROCAR</button>
        </div>
    </div>

    <div class="right-column">
        <h1 id="prod-name">NOME DO JOGO</h1>
        <p id="prod-price" class="price">R$ XXX,XX</p>
        <p id="prod-seller" class="seller">De “Usuário Revendedor”</p>

        <h3>Descrição do Jogo:</h3>
        <p id="prod-desc" class="description">
        </p>

        <p class="rating-title">Modalidades Disponíveis</p>
        <p id="rating-count">5/5</p>

        <div class="stars" id="stars">
        </div>
    </div>

</main>

</body>
</html>
